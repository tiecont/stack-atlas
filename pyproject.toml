[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-atlas"
version = "2.0.0"
description = "Source-first static engineering knowledge platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
stack-atlas-build = "stack_atlas.cli.build:main"
stack-atlas-validate = "stack_atlas.cli.validate:main"
stack-atlas-serve = "stack_atlas.cli.serve:main"

[tool.setuptools]
package-dir = {"" = "platform"}

[tool.setuptools.packages.find]
where = ["platform"]
include = ["stack_atlas*"]
