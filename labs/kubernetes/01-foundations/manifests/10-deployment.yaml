apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-demo-api
  namespace: atlas-foundations
  labels:
    app.kubernetes.io/name: atlas-demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: stack-atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-demo-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: stack-atlas
    spec:
      containers:
        - name: api
          image: atlas-demo-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
