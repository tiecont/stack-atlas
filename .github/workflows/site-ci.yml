name: Site CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build dependencies
        run: python3 -m pip install -e .
      - name: Validate source catalog and repository structure
        run: make validate
      - name: Run platform regressions
        run: make test-site
      - name: Build deployable site preview
        run: make build BASE_PATH="/${{ github.event.repository.name }}" SITE_URL="https://${{ github.repository_owner }}.github.io"
