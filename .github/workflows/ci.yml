name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tiecont/stack-atlas-web

jobs:
  ci:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Validate content catalog
        run: npm run content:validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

  e2e:
    name: Public site browser tests
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-atlas-playwright-report
          path: |
            playwright-report/
            playwright-report-admin/
          retention-days: 30

  docker-validate:
    name: Validate Docker image
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: stack-atlas-web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:3000/api/v1/
            NEXT_PUBLIC_BASE_PATH=
            SITE_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify learner and admin runtime modes on the same image
        run: |
          set -eu
          runtime_name=""
          print_container_diagnostics() {
            diagnostic_name="$1"
            echo "Docker diagnostics for $diagnostic_name"
            docker ps -a || true
            docker inspect "$diagnostic_name" || true
            docker logs "$diagnostic_name" || true
          }
          cleanup_runtime() {
            result=$?
            if [ "$result" -ne 0 ] && [ -n "$runtime_name" ]; then
              print_container_diagnostics "$runtime_name"
            fi
            if [ -n "$runtime_name" ]; then docker rm -f "$runtime_name" >/dev/null 2>&1 || true; fi
            return "$result"
          }
          trap cleanup_runtime EXIT
          wait_for_http_ready() {
            local name="$1"
            local port="$2"
            local output="$3"
            local curl_log
            local deadline
            local state
            curl_log="/tmp/$name-curl.log"
            deadline=$((SECONDS + 60))
            : >"$curl_log"
            while [ "$SECONDS" -lt "$deadline" ]; do
              state=$(docker inspect --format '{{.State.Status}}' "$name" 2>/dev/null || true)
              case "$state" in
                exited|dead)
                  print_container_diagnostics "$name"
                  cat "$curl_log"
                  echo "Container $name exited before its health endpoint became ready (state: $state)."
                  return 1
                  ;;
                running)
                  if curl --fail --silent --show-error --connect-timeout 1 --max-time 5 \
                    "http://127.0.0.1:$port/api/healthz/" --output "$output" 2>>"$curl_log"; then
                    return 0
                  fi
                  ;;
                *)
                  # Docker can briefly report `created` immediately after `docker run --detach`.
                  ;;
              esac
              sleep 1
            done
            print_container_diagnostics "$name"
            cat "$curl_log"
            echo "Container $name did not return a healthy response within 60 seconds."
            return 1
          }
          expect_platform_startup_failure() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              docker run --detach --name "$name" --env "STACK_ATLAS_WEB_PLATFORM=$value" stack-atlas-web:ci
            else
              docker run --detach --name "$name" stack-atlas-web:ci
            fi
            state=running
            attempt=0
            while [ "$state" != exited ] && [ "$attempt" -lt 15 ]; do
              state=$(docker inspect --format '{{.State.Status}}' "$name")
              if [ "$state" != exited ]; then sleep 1; fi
              attempt=$((attempt + 1))
            done
            if [ "$state" != exited ]; then
              print_container_diagnostics "$name"
              docker rm -f "$name"
              echo "The image did not exit after rejecting STACK_ATLAS_WEB_PLATFORM=$value."
              exit 1
            fi
            exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$name")
            docker logs "$name" >"/tmp/$name.log" 2>&1
            if [ "$exit_code" = 0 ] || ! grep -q 'STACK_ATLAS_WEB_PLATFORM' "/tmp/$name.log"; then
              print_container_diagnostics "$name"
              cat "/tmp/$name.log"
              docker rm "$name"
              echo "The image did not reject STACK_ATLAS_WEB_PLATFORM=$value as expected."
              exit 1
            fi
            docker rm "$name"
          }
          expect_platform_startup_failure stack-atlas-web-missing-platform ""
          expect_platform_startup_failure stack-atlas-web-invalid-platform invalid
          for mode in learner admin; do
            if [ "$mode" = learner ]; then
              port=3011
              expected='Explore topics'
            else
              port=3012
              expected='Content workspace'
            fi
            runtime_name="stack-atlas-web-$mode"
            docker run --detach --name "$runtime_name" \
              --publish "127.0.0.1:$port:3001" \
              --env "STACK_ATLAS_WEB_PLATFORM=$mode" stack-atlas-web:ci
            wait_for_http_ready "$runtime_name" "$port" "/tmp/stack-atlas-web-$mode-health.json"
            grep -q '"status":"ok"' "/tmp/stack-atlas-web-$mode-health.json"
            if [ "$mode" = learner ]; then
              curl --fail --silent --show-error \
                --retry 20 --retry-delay 1 --retry-connrefused \
                "http://127.0.0.1:$port/" --output "/tmp/stack-atlas-web-$mode.html"
              grep -q "$expected" "/tmp/stack-atlas-web-$mode.html"
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/admin/")
              test "$status" = 404
            else
              root_status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/")
              root_location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' "http://127.0.0.1:$port/")
              test "$root_status" = 307
              case "$root_location" in
                */admin/) ;;
                *) echo "Admin root did not redirect to /admin/: $root_location"; exit 1 ;;
              esac
              curl --fail --silent --show-error --location \
                --retry 20 --retry-delay 1 --retry-connrefused \
                "http://127.0.0.1:$port/" --output "/tmp/stack-atlas-web-$mode.html"
              grep -q "$expected" "/tmp/stack-atlas-web-$mode.html"
              grep -q 'Administration' "/tmp/stack-atlas-web-$mode.html"
              curl --fail --silent --show-error \
                "http://127.0.0.1:$port/admin/content/" \
                --output "/tmp/stack-atlas-web-$mode-content.html"
              grep -q 'Search content' "/tmp/stack-atlas-web-$mode-content.html"
              grep -q 'New content' "/tmp/stack-atlas-web-$mode-content.html"
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/articles/")
              test "$status" = 404
              status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:$port/paths/")
              test "$status" = 404
            fi
            docker stop "$runtime_name"
            docker rm "$runtime_name"
            runtime_name=""
          done

  build-and-push:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [ci, e2e, docker-validate]
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v')) &&
      vars.NEXT_PUBLIC_API_BASE_URL != '' &&
      vars.SITE_URL != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop-latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}
            SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
