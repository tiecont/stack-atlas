name: Kubernetes labs

on:
  pull_request:
    paths:
      - "content/**"
      - "labs/kubernetes/**"
      - "examples/atlas-demo-api/**"
      - "platform/**"
      - "scripts/ci/**"
      - "tests/kubernetes/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/kubernetes-labs.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "labs/kubernetes/**"
      - "examples/atlas-demo-api/**"
      - "platform/**"
      - "scripts/ci/**"
      - "tests/kubernetes/**"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/kubernetes-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/atlas-demo-api/go.mod
      - run: python3 -m pip install -e .
      - run: make validate
      - run: bash tests/kubernetes/context_safety.sh
      - run: go test -race ./...
        working-directory: examples/atlas-demo-api
      - run: make build

  kind-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/atlas-demo-api/go.mod
      - run: python3 -m pip install -e .
      - name: Install pinned kind and kubectl
        run: |
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 --output /tmp/kind
          chmod +x /tmp/kind
          sudo install /tmp/kind /usr/local/bin/kind
          curl --fail --location --silent --show-error https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl --output /tmp/kubectl
          chmod +x /tmp/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: Print tool versions
        run: |
          kind version
          kubectl version --client
          docker version
      - name: Validate and run foundations lab
        run: CLEANUP=1 make test-kubernetes
