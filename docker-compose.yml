name: stack-atlas

services:
  web:
    image: stack-atlas-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1/}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        SITE_URL: ${SITE_URL:-http://localhost:3001}
    ports:
      - '${WEB_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      SITE_URL: ${SITE_URL:-http://localhost:3001}
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:3001/api/healthz/', (response) =>
          process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () =>
          process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
