<section id="signals"><h2>Signals</h2><ul><li>CPU</li><li>memory trong một số workload</li><li>RPS/custom metrics</li><li>queue lag</li></ul></section><section id="lag-problem"><h2>Lag problem</h2><p>Autoscaling luôn có delay. Nếu traffic spike nhanh, bạn vẫn cần headroom và load shedding.</p></section><section id="dependency"><h2>Dependency</h2><div class="callout ">Scale pod không giúp nếu bottleneck thật là PostgreSQL connection limit.</div></section>
