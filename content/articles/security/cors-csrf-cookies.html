<section id="cors"><h2>CORS</h2><p>CORS là browser policy về cross-origin reads; nó không phải authorization.</p></section><section id="csrf"><h2>CSRF</h2><p>CSRF khai thác credential tự động gửi như cookie để ép browser thực hiện request ngoài ý muốn.</p></section><section id="cookie-flags"><h2>Cookie flags</h2><ul><li>HttpOnly</li><li>Secure</li><li>SameSite phù hợp</li><li>short lifetime</li><li>rotation</li></ul></section>
